[package]
name = "codebot-gui"
publish = false
version.workspace = true
edition.workspace = true
[dependencies]
codebot-core.workspace = true
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
tempfile = "3"
pulldown-cmark = { version = "0.12", default-features = false }
egui_commonmark = { version = "0.20", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
