[package]
name = "codebot-core"
publish = false
version.workspace = true
edition.workspace = true
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
getrandom = "0.2"
ignore = "0.4"
tempfile = "3"
fs2 = "0.4"
wasmi = { version = "2", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"] }
percent-encoding = "2"
similar = "2"
cap-std = "3"
tokio = { version = "1", features = ["rt", "time", "macros"] }
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
wat = "1"
