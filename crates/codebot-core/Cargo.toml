[package]
name = "codebot-core"
version.workspace = true
edition.workspace = true
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
getrandom = "0.2"
ignore = "0.4"
tempfile = "3"
percent-encoding = "2"
similar = "2"
cap-std = "3"
tokio = { version = "1", features = ["rt", "time", "macros"] }
